name: jsc-executed-proof
on:
  push:
  workflow_dispatch:

jobs:
  jsc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Pin (read audit base commit)
        run: echo "WEBKIT_SHA=$(cat webkit-version.txt)" >> "$GITHUB_ENV"

      - name: Cache WebKit clone + build
        uses: actions/cache@v4
        with:
          path: |
            webkit
            WebKitBuild
          key: jsc-v1-${{ env.WEBKIT_SHA }}

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ruby-full python3 perl gperf bison flex libicu-dev pkg-config

      - name: Clone WebKit at pinned commit
        run: |
          if [ ! -d webkit/.git ]; then
            git clone --filter=blob:none --no-checkout https://github.com/WebKit/WebKit.git webkit
          fi
          cd webkit
          git fetch --depth 1 origin "$WEBKIT_SHA"
          git checkout -f FETCH_HEAD
          git rev-parse HEAD

      - name: Build jsc (jsc-only, release)
        run: cd webkit && ./Tools/Scripts/build-jsc --jsc-only --release

      - name: Run PoCs (control vs attack, verbatim log = source of truth)
        run: |
          set +e
          JSC=./webkit/WebKitBuild/Release/bin/jsc
          echo "JSC_SHA: $WEBKIT_SHA"
          for f in poc/*.js; do
            echo "===== $f ====="
            "$JSC" "$f"
            echo "exit_code[$f]=$?"
          done
